[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-4a-novelai"
version = "1.0.0"
description = "Standalone NovelAI image-generation plugin for ComfyUI (V4.5 and later): native NAI prompt scheduler with multi-character prompting, txt2img / img2img / inpainting, Vibe and Precise Reference, metadata reuse, Anlas usage monitoring, and lossless original PNG saving. Optional Wildcard integration with 4A Prompt Manager."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tsukino4A" }]
dependencies = ["msgpack"]

[project.urls]
Repository = "https://github.com/tsukino4a/ComfyUI-4A-NovelAI"
Documentation = "https://github.com/tsukino4a/ComfyUI-4A-NovelAI#readme"
"Bug Tracker" = "https://github.com/tsukino4a/ComfyUI-4A-NovelAI/issues"

[tool.comfy]
PublisherId = "tsukino4a"
DisplayName = "4A NovelAI"

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "nodes*", "server*", "services*"]
